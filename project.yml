name: HojoWatch
options:
  bundleIdPrefix: com.sidebiz
  developmentLanguage: ja
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: TJM8F4Z2Z2
    CODE_SIGN_STYLE: Automatic
targets:
  HojoWatch:
    type: application
    platform: iOS
    sources:
      - path: HojoWatch
        excludes: [Info.plist]
      - Shared
    dependencies:
      - target: HojoWatchWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sidebiz.hojowatch
        CODE_SIGN_ENTITLEMENTS: HojoWatch/HojoWatch.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: HojoWatch/Info.plist
        INFOPLIST_KEY_NSCameraUsageDescription: 申請書類（見積書・決算書など）をスキャンするためにカメラを使います。
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: 補助金ウォッチ
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        TARGETED_DEVICE_FAMILY: "1"
    scheme:
      storeKitConfiguration: HojoWatch.storekit
      testTargets: [HojoWatchTests]
  HojoWatchWidget:
    type: app-extension
    platform: iOS
    sources:
      - HojoWatchWidget
      - Shared
      - HojoWatch/Services/Deadline.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sidebiz.hojowatch.widget
        INFOPLIST_FILE: HojoWatchWidget/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 補助金ウォッチ
        CODE_SIGN_ENTITLEMENTS: HojoWatchWidget/HojoWatchWidget.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
  HojoWatchTests:
    type: bundle.unit-test
    platform: iOS
    sources: [HojoWatchTests]
    dependencies:
      - target: HojoWatch
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
