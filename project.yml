name: HojoWatch
options:
  bundleIdPrefix: com.sidebiz
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: TJM8F4Z2Z2
    CODE_SIGN_STYLE: Automatic
targets:
  HojoWatch:
    type: application
    platform: iOS
    sources: [HojoWatch]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sidebiz.hojowatch
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: 補助金ウォッチ
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        TARGETED_DEVICE_FAMILY: "1"
    scheme:
      storeKitConfiguration: HojoWatch.storekit
      testTargets: [HojoWatchTests]
  HojoWatchTests:
    type: bundle.unit-test
    platform: iOS
    sources: [HojoWatchTests]
    dependencies:
      - target: HojoWatch
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
